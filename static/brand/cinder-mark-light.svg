  <!--
    THE MARK — the merkaba, held off-rest, with the ember at its center.

    Two interlocked tetrahedra are already Cinder's own geometry: two fields
    that only work as one, which is exactly the two-factor model (link key +
    passphrase). The figure lives in the product as src/lib/ui/Merkaba.svelte,
    breathing behind the hero. This is that same figure made still.

    THE 24 DEGREE OFFSET IS LOAD-BEARING, NOT STYLING. Two equilateral
    triangles exactly 60 degrees apart resolve into a hexagram, a religious and
    national symbol this product has no claim on. Held 36 degrees apart they
