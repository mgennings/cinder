    +42, which is the one pairing in that family that is also mirror-symmetric
    about the vertical axis, so the mark stands up straight instead of leaning.
    "Cleaning up" these angles draws a different mark for a different
    organization. Don't.

    Ember on transparent, so it sits on the vault floor or on warm paper.
    cinder-mark-light.svg is the same geometry in the light-theme ember for
    surfaces Cinder does not control the background of.

    STROKE 3.5 IN A 64 UNIT BOX IS MEASURED, NOT PICKED. Rendered at 16px
    against the vault floor and against white, 3, 3.5, 4, and 4.5 were compared
    pixel by pixel: 3.5 is the heaviest stroke that still leaves a readable void
    between the triangles and the ember core at favicon size, and it holds up at
    32 and above. Going heavier fills that void in and the mark becomes a blob.
  -->
