AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Cinder - zero-knowledge self-destructing notes

Parameters:
  PrimaryDomain:
    Type: String
    Default: cinder.ink
    Description: The keeper brand domain
  WwwDomain:
    Type: String
    Default: www.cinder.ink
    Description: www variant of the brand domain
  SiteDomain:
    Type: String
    Default: cinder.uxuiai.org
    Description: Subdomain alias (kept live)
  LegacyDomain:
    Type: String
    Default: blip.uxuiai.org
    Description: Former domain, kept as an alias so old links keep resolving
  CertificateArn:
    Type: String
    Description: ACM cert ARN covering all four names (must be in us-east-1 for CloudFront)

  # --- mattOS identity ---------------------------------------------------
  # Every value below is created by hand in the Apple and Google consoles.
  # docs/identity.md names each field and where it comes from. None has a
  # default: a half-configured identity provider must fail the deploy rather
  # than ship a sign-in button that leads nowhere.
  IdentityDomainPrefix:
    Type: String
    Default: mattos-identity
    Description: Cognito hosted-UI domain prefix (must be globally unique in the region)
  # The name a person actually reads on Google's and Apple's consent screens.
  # Both providers show the domain the OAuth flow runs on, so the raw
  # `mattos-identity.auth.us-east-1.amazoncognito.com` was the first thing
  # anyone saw before handing over an identity. This is that defect's fix.
  IdentityCustomDomain:
    Type: String
    Default: auth.cinder.ink
    Description: Custom hosted-UI domain (parent domain must already resolve via an A record)
  IdentityCustomDomainCertArn:
    Type: String
    Default: arn:aws:acm:us-east-1:553806908724:certificate/a703e418-e876-4f30-be20-2312ba89f07a
    Description: ACM cert for IdentityCustomDomain — must be in us-east-1, Cognito attaches it to CloudFront
  AppleServicesId:
    Type: String
    Description: Apple Services ID, e.g. org.uxuiai.cinder.signin
  AppleTeamId:
    Type: String
    Description: Apple Developer Team ID
  AppleKeyId:
    Type: String
    Description: Key ID of the Sign in with Apple .p8 key
  ApplePrivateKey:
    Type: String
    NoEcho: true
    Description: Contents of the Sign in with Apple .p8 private key
  GoogleClientId:
    Type: String
    Description: Google OAuth 2.0 web client ID
  GoogleClientSecret:
    Type: String
    NoEcho: true
    Description: Google OAuth 2.0 web client secret
  # The HMAC key that turns a Cognito subject into Cinder's pairwise subject.
  # ROTATING IT ORPHANS EVERY EXISTING ENTITLEMENT — the old rows are keyed by
  # a value nothing can compute again. It is not a rotatable credential; it is
  # part of the identity of the data. See .notes/GOTCHAS.md.
  CinderPepper:
    Type: String
    NoEcho: true
    Description: Per-product HMAC pepper for Cinder pairwise subjects (never rotate)

  # --- payments ------------------------------------------------------------
  # No defaults, on purpose. A stack that deploys with a blank Stripe secret
  # would stand up a checkout button that silently fails, and a blank webhook
  # secret would stand up a webhook that verifies nothing — verifyStripeSignature
  # refuses an empty secret, so it would deny every event rather than accept
  # every event, but neither is a thing to discover in production.
  #
  # Production uses Cinder's live restricted key and live endpoint secret.
  # Sandboxes use their own keys and endpoints; never cross those modes. See
  # docs/pro-payments.md.
  #
  # Cinder has its OWN Stripe account, not a share of another product's. Stripe
  # branding, the statement descriptor (CINDER.INK), receipts, and dispute
  # history are all ACCOUNT-level, so a shared account would put the wrong name
  # on a buyer's card statement. The handler reads these as per-product maps —
  # see api/src/purchase.mjs — so a third domain is a third account and a third
  # row, never a rewrite.
  CinderStripeSecretKey:
    Type: String
    NoEcho: true
    Description: Cinder's own Stripe account key (rk_live_… in production)
  CinderStripeWebhookSecret:
    Type: String
    NoEcho: true
    Description: Signing secret of Cinder's webhook endpoint on that account (whsec_…)
  CinderProPriceId:
    Type: String
    Description: Stripe Price id for the Cinder Pro credit bundle (price_…)
  CinderProCredits:
    Type: Number
    Default: 10
    MinValue: 1
    Description: >-
      Large sends one purchase adds. Must agree with what CinderProPriceId
      charges — this number is the product, the Price is only what it costs.

  # The HMAC key the identity API signs capability grants with and the transfer
  # API verifies them with. It is the ONLY thing the two APIs share, and sharing
  # it is what lets them stay otherwise unaware of each other: the transfer API
  # never calls the identity API, never reads the entitlement table, and never
  # learns who is sending.
  #
  # ROTATABLE, unlike CinderPepper. A grant lives fifteen minutes, so rotating
  # this invalidates at most fifteen minutes of in-flight grants and the client
  # simply mints a new one. Nothing durable is keyed by it.
  CinderCapabilitySecret:
    Type: String
    NoEcho: true
    Description: HMAC key for capability grants (rotatable; grants live 15 minutes)

  # Separate from account capability grants. A sender status token authorizes
  # exactly one read-only lifecycle check and carries no identity.
  CinderStatusSecret:
    Type: String
    NoEcho: true
    Description: Rotatable HMAC key for sender-only transfer status tokens

Globals:
  Function:
    Runtime: nodejs22.x
    Architectures: [arm64]
    Timeout: 5
    MemorySize: 128
    # A ceiling AND a floor, and the honest description of it is narrower than
    # it first looks.
    #
    # Lambda concurrency is one pool per account, shared with every other
    # project here. Unreserved, a flood against cinder.ink could consume all
    # 987 available executions and starve everything else — so this bounds
    # blast radius AND guarantees Cinder its own slots.
    #
    # What it bounds: Lambda COMPUTE. Roughly $17/day fully saturated, not the
    # $14 an earlier version of this comment claimed. It does NOT bound API
    # Gateway request charges (far larger at the same saturation), DynamoDB
    # writes, or S3 storage from abandoned uploads. Do not quote a total-bill
    # number here; nothing in this template bounds the total bill.
    #
    # What it is NOT: a security control. Measured, 40 concurrent claims yield
    # exactly 10 served and 30 shed, and warm service is ~165ms — so ~61 req/s
    # from ONE machine can hold every slot and deny delivery for about nothing.
    # A rate limit does not fix that at this pool size either. What redeems it
    # is that shedding is non-destructive: a throttled request never invokes the
    # function, so the atomic claim never runs and no transfer is consumed.
    #
    # It collects nothing about anyone. That is the rare property here — it
    # sheds by "no worker is free", never by recognizing who is asking.
    ReservedConcurrentExecutions: 10
    Environment:
      Variables:
        TABLE_NAME: !Ref NotesTable
        MEDIA_BUCKET: !Ref MediaBucket

Resources:
  NotesTable:
    Type: AWS::DynamoDB::Table
    # Retain, because this table holds live ciphertext people are waiting to
    # collect. A stack delete or any future property change that forces a
    # replacement would otherwise destroy in-flight notes and files silently,
    # and there is no email on file to tell anyone it happened.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: blip-notes
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      # Exact origins, not '*'. The API hands out ciphertext and one-use upload
      # authorizations; there is no reason for a page Cinder did not serve to be
      # able to read either.
      CorsConfiguration:
        AllowOrigins:
          - !Sub 'https://${PrimaryDomain}'
          - !Sub 'https://${WwwDomain}'
          - !Sub 'https://${SiteDomain}'
          - !Sub 'https://${LegacyDomain}'
        AllowMethods: [POST, OPTIONS]
        AllowHeaders: [content-type]
      # A cost and abuse ceiling, NOT the defense against locator guessing.
      # Measured on the deployed stage: 150 concurrent claims at ~265 req/s were
      # not throttled at all, and shedding only began somewhere past 200
      # concurrent. HTTP API stage throttling is best-effort, so do not credit
      # it with a security property. What actually makes guessing hopeless is
      # 256 bits of locator entropy. If real enforcement is ever needed, it has
      # to be CloudFront + WAF with a rate-based rule in front of this API.
      DefaultRouteSettings:
        ThrottlingBurstLimit: 40
        ThrottlingRateLimit: 20

  CreateNoteFn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: api/
      Handler: src/lambda.createNote
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:PutItem]
              Resource: !GetAtt NotesTable.Arn
      Events:
        Create:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /notes
            Method: POST

  ReadNoteFn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: api/
      Handler: src/lambda.readNote
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:DeleteItem]
              Resource: !GetAtt NotesTable.Arn
      Events:
        Read:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /notes/{id}/burn
            Method: POST

  # --- File transfer: private ciphertext bucket + three separated roles ---
  #
  # Nothing about this bucket is reachable from the internet. The only paths in
  # or out are a five-minute presigned PUT and the claim Lambda. Only the claim
  # function can list it, and only so a deleted object answers 404 instead of
  # 403 (see ClaimFileFn) — knowing the bucket exists tells you nothing about what
  # is in it, and an object key cannot be derived from a link.
  MediaBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'blip-media-${AWS::AccountId}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      # ACLs off entirely. There is one owner and no sharing model to get wrong.
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      # Deliberately NOT versioned. A version history of a file whose whole
      # promise is deletion would quietly keep the thing we said we destroyed.
      LifecycleConfiguration:
        Rules:
          # Backstop only. The claim path deletes its object synchronously; this
          # sweeps abandoned uploads and grants that expired unread. Eight days
          # clears the seven-day maximum TTL with a day to spare.
          # Two tiers, because a flat 8 days ignored what the sender chose.
          # createFile prefixes the object key by TTL band, so a one-hour
          # transfer's bytes are swept the next day instead of lingering a
          # week. The prefix reveals only a coarse band, and only to a caller
          # that can already list — which is ClaimFileFn alone.
          - Id: expire-short-lived-ciphertext
            Status: Enabled
            Prefix: d1/
            ExpirationInDays: 1
          - Id: expire-orphaned-ciphertext
            Status: Enabled
            Prefix: d8/
            ExpirationInDays: 8
          # Video segments live under v/ — the prefix that scopes the
          # segment-url role's GetObject (docs/video-api-contract.md). Same
          # band logic, own rules, because a prefix rule on d1/ does not match
          # v/d1/. These are the stated backstop under the scheduled burn: the
          # at-read guard ends availability exactly on time, the one-shot
          # schedule removes objects within about a minute, and this collects
          # anything a crash orphaned.
          #
          # TWO days for v/d1/, not one, and the extra day is load-bearing: a
          # video claimed in the last minutes of a just-under-24-hour expiry
          # holds its watch window open past creation + 24h (up to +26.2h with
          # every extension), and S3's day-granular sweep can run as soon as
          # ~24h after creation. One day here could destroy segments inside an
          # open window — the exact promise the window makes. Files never have
          # this tail (delivery is instantaneous at claim), which is why d1/
          # stays at 1.
          - Id: expire-short-lived-video-ciphertext
            Status: Enabled
            Prefix: v/d1/
            ExpirationInDays: 2
          - Id: expire-orphaned-video-ciphertext
            Status: Enabled
            Prefix: v/d8/
            ExpirationInDays: 8
          - Id: abort-incomplete-uploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
      CorsConfiguration:
        CorsRules:
          # GET exists for exactly one caller shape: the watch page fetching a
          # presigned segment GET (video ciphertext under v/). CORS is not the
          # authorization — the presigned signature is, and only the
          # SegmentUrlFn role, scoped to v/*, can produce one. No presigned GET
          # exists for a file object; that stance is unchanged.
          - AllowedOrigins:
              - !Sub 'https://${PrimaryDomain}'
              - !Sub 'https://${WwwDomain}'
              - !Sub 'https://${SiteDomain}'
              - !Sub 'https://${LegacyDomain}'
            AllowedMethods: [PUT, GET]
            AllowedHeaders: [content-type, x-amz-checksum-sha256]
            MaxAge: 300

  MediaBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref MediaBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyPlaintextTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt MediaBucket.Arn
              - !Sub '${MediaBucket.Arn}/*'
            Condition:
              Bool:
                'aws:SecureTransport': false

  CreateFileFn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: api/
      Handler: src/lambda.createFile
      # The one function on the transfer API that holds this secret, because it
      # is the one that asks the capability gate. Finalize and claim are never
      # gated — a recipient must not need an account to receive what a sender
      # already paid to send — so neither of them can verify a grant either.
      Environment:
        Variables:
          CAPABILITY_SECRET: !Ref CinderCapabilitySecret
          STATUS_SECRET: !Ref CinderStatusSecret
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:PutItem]
              Resource: !GetAtt NotesTable.Arn
            # Needed for the presigned PUT to carry any authority at all — a
            # presigned URL can never exceed its signer's own permissions.
            - Effect: Allow
              Action: [s3:PutObject]
              Resource: !Sub '${MediaBucket.Arn}/*'
      Events:
        Create:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /files
            Method: POST

  FinalizeFileFn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: api/
      Handler: src/lambda.finalizeFile
      Timeout: 10
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:UpdateItem]
              Resource: !GetAtt NotesTable.Arn
            # GetObjectAttributes returns size and checksum without the body,
            # but AWS requires s3:GetObject alongside it ("you need the
            # s3:GetObject and s3:GetObjectAttributes permissions" —
            # API_GetObjectAttributes). So this role CAN read a stored object.
            # An earlier draft claimed it could not; that was wrong, and S3's
            # permission model offers no way to make it true. What still holds:
            # no s3:DeleteObject, and no s3:ListBucket, so finalize cannot
            # destroy anything or discover a key it was not handed.
            - Effect: Allow
              Action: [s3:GetObject, s3:GetObjectAttributes]
              Resource: !Sub '${MediaBucket.Arn}/*'
      Events:
        Finalize:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /files/finalize
            Method: POST

  StatusFileFn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: api/
      Handler: src/lambda.statusFile
      Environment:
        Variables:
          STATUS_SECRET: !Ref CinderStatusSecret
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem]
              Resource: !GetAtt NotesTable.Arn
      Events:
        Status:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /files/status
            Method: POST

  StatusFileLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${StatusFileFn}'
      RetentionInDays: 14

  ClaimFileFn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: api/
      Handler: src/lambda.claimFile
      # The one delivery attempt buffers the whole ciphertext and base64-encodes
      # it. Memory here is really CPU: at 1024 MB the encode is milliseconds
      # rather than seconds, which shortens the window in which a disconnect
      # permanently eats someone's file.
      Timeout: 15
      MemorySize: 1024
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:DeleteItem]
              Resource: !GetAtt NotesTable.Arn
            # GetObject covers HeadObject, which is the absence check.
            - Effect: Allow
              Action: [s3:GetObject, s3:DeleteObject]
              Resource: !Sub '${MediaBucket.Arn}/*'
            # This one grant is a deliberate, documented exception to the
            # otherwise strict no-ListBucket rule, and it exists for exactly one
            # reason: without s3:ListBucket, S3 answers a request for a missing
            # object with 403 instead of 404. The post-delete absence check
            # would then be unable to tell "the object is gone" from "I am not
            # allowed to look" — and "not allowed to look" is not a deletion
            # proof. Withholding it would either break every claim or force the
            # check to accept an ambiguous answer, which is worse than not
            # having the check. Only the claim function gets it; create and
            # finalize still cannot list.
            - Effect: Allow
              Action: [s3:ListBucket]
              Resource: !GetAtt MediaBucket.Arn
      Events:
        Claim:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /files/claim
            Method: POST

  # Retention pinned in code. Lambda auto-creates these groups at "Never
  # Expire", and CloudFormation does not manage them, so a logical-id change or
  # a stack rebuild silently reverts to keeping logs forever. Today they hold
  # only lifecycle lines, but "forever" plus one future console.error is how a
  # privacy promise dies quietly.
  ClaimFileLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub '/aws/lambda/${ClaimFileFn}'
      RetentionInDays: 14

  # =====================================================================
  # EPHEMERAL VIDEO — docs/video-api-contract.md is the wire contract,
  # docs/ephemeral-video-design.md the promise. A third artifact on the same
  # transfer API and the same table; the note and file functions above are
  # untouched. The one departure from the file path — presigned GETs for
  # segment ciphertext — is bounded structurally here: video objects live
  # under v/, and only SegmentUrlVideoFn's GetObject is scoped to v/*, so no
  # role that can sign a video GET can name a burn-mode file object.
  #
  # DEPLOY GATE, standing rule: shipping video changes privacy-relevant
  # strings and what leaves the device (the presigned-GET path), so the deploy
  # that turns this on sits behind the existing privacy-deploy gate.
  # =====================================================================

  CreateVideoFn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: api/
      Handler: src/video-lambda.createVideo
      # Presigning up to 128 uploads and writing 129 rows is real work.
      Timeout: 15
      Environment:
        Variables:
          CAPABILITY_SECRET: !Ref CinderCapabilitySecret
          STATUS_SECRET: !Ref CinderStatusSecret
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:PutItem]
              Resource: !GetAtt NotesTable.Arn
            # Presigned PUT authority, video keys only.
            - Effect: Allow
              Action: [s3:PutObject]
              Resource: !Sub '${MediaBucket.Arn}/v/*'
      Events:
        Create:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /videos
            Method: POST

  FinalizeVideoFn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: api/
      Handler: src/video-lambda.finalizeVideo
      Timeout: 10
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:UpdateItem]
              Resource: !GetAtt NotesTable.Arn
            # Same caveat as FinalizeFileFn: GetObject rides along with
            # GetObjectAttributes whether wanted or not. Scoped to v/*, so
            # this role cannot read a file object either way.
            - Effect: Allow
              Action: [s3:GetObject, s3:GetObjectAttributes]
              Resource: !Sub '${MediaBucket.Arn}/v/*'
      Events:
        Finalize:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /videos/finalize
            Method: POST

  ClaimVideoFn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: api/
      Handler: src/video-lambda.claimVideo
      Environment:
        Variables:
          BURN_FUNCTION_ARN: !Sub 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:cinder-video-burn'
          BURN_SCHEDULER_ROLE_ARN: !GetAtt BurnSchedulerRole.Arn
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:UpdateItem]
              Resource: !GetAtt NotesTable.Arn
        - !Ref BurnArmPolicy
      Events:
        Claim:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /videos/claim
            Method: POST

  SegmentUrlVideoFn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: api/
      Handler: src/video-lambda.segmentUrl
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem]
              Resource: !GetAtt NotesTable.Arn
            # THE STRUCTURAL BOUNDARY of the presigned-GET departure. v/* and
            # nothing else: a role that cannot name a file object cannot sign
            # a GET for one, so the file promise's no-presigned-GET stance is
            # provable rather than promised.
            - Effect: Allow
              Action: [s3:GetObject]
              Resource: !Sub '${MediaBucket.Arn}/v/*'
      Events:
        SegmentUrl:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /videos/segment-url
            Method: POST

  FinishedVideoFn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: api/
      Handler: src/video-lambda.finishedVideo
      Environment:
        Variables:
          BURN_FUNCTION_ARN: !Sub 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:cinder-video-burn'
          BURN_SCHEDULER_ROLE_ARN: !GetAtt BurnSchedulerRole.Arn
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:UpdateItem]
              Resource: !GetAtt NotesTable.Arn
        - !Ref BurnArmPolicy
      Events:
        Finished:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /videos/finished
            Method: POST

  ExtendVideoFn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: api/
      Handler: src/video-lambda.extendVideo
      # The only video function beyond create that verifies a grant: a
      # recipient extending with their own credits presents video.extend.
      Environment:
        Variables:
          CAPABILITY_SECRET: !Ref CinderCapabilitySecret
          BURN_FUNCTION_ARN: !Sub 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:cinder-video-burn'
          BURN_SCHEDULER_ROLE_ARN: !GetAtt BurnSchedulerRole.Arn
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:UpdateItem]
              Resource: !GetAtt NotesTable.Arn
        - !Ref BurnArmPolicy
      Events:
        Extend:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /videos/extend
            Method: POST

  StatusVideoFn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: api/
      Handler: src/video-lambda.statusVideo
      Environment:
        Variables:
          STATUS_SECRET: !Ref CinderStatusSecret
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem]
              Resource: !GetAtt NotesTable.Arn
      Events:
        Status:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /videos/status
            Method: POST

  DestroyVideoFn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: api/
      Handler: src/video-lambda.destroyVideo
      Timeout: 15
      Environment:
        Variables:
          STATUS_SECRET: !Ref CinderStatusSecret
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:DeleteItem]
              Resource: !GetAtt NotesTable.Arn
            - Effect: Allow
              Action: [s3:DeleteObject]
              Resource: !Sub '${MediaBucket.Arn}/v/*'
      Events:
        Destroy:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /videos/destroy
            Method: POST

  # The one-shot burn target. NOT an API route: EventBridge Scheduler invokes
  # it with { pk, segmentPks } — hashes only, never a locator, so the schedule
  # store holds nothing replayable against the API. The explicit FunctionName
  # is what the armers' BURN_FUNCTION_ARN is built from; it breaks the circular
  # reference a GetAtt would create for the self-healing re-arm below.
  BurnVideoFn:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: cinder-video-burn
      CodeUri: api/
      Handler: src/video-lambda.burnVideo
      # Sweeping 128 rows and objects.
      Timeout: 30
      Environment:
        Variables:
          # Its own ARN, for the self-healing re-arm: a stale schedule that
          # fires before a moved deadline re-schedules itself at the row's
          # live deadline instead of leaving the sweep to the lifecycle rule.
          BURN_FUNCTION_ARN: !Sub 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:cinder-video-burn'
          BURN_SCHEDULER_ROLE_ARN: !GetAtt BurnSchedulerRole.Arn
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:DeleteItem]
              Resource: !GetAtt NotesTable.Arn
            - Effect: Allow
              Action: [s3:DeleteObject]
              Resource: !Sub '${MediaBucket.Arn}/v/*'
        - !Ref BurnArmPolicy

  # What the schedule assumes to invoke the burn. Scheduler is the only
  # principal that can wear it, and invoking cinder-video-burn is the only
  # thing it can do.
  BurnSchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                'aws:SourceAccount': !Ref 'AWS::AccountId'
      Policies:
        - PolicyName: invoke-burn
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !Sub 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:cinder-video-burn'

  # Shared by every function that arms or re-arms the burn: claim, finished,
  # extend, and the burn itself. Names are cinder-video-burn-<hash>, one per
  # video, in the default group.
  BurnArmPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: [scheduler:CreateSchedule, scheduler:UpdateSchedule]
            Resource: !Sub 'arn:aws:scheduler:${AWS::Region}:${AWS::AccountId}:schedule/default/cinder-video-burn-*'
          - Effect: Allow
            Action: iam:PassRole
            Resource: !GetAtt BurnSchedulerRole.Arn
            Condition:
              StringEquals:
                'iam:PassedToService': scheduler.amazonaws.com

  # Retention pinned at birth for every video function — none has ever
  # deployed, so none of these groups exists to collide with, and a default of
  # forever is exactly the accumulation this product refuses.
  CreateVideoLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${CreateVideoFn}'
      RetentionInDays: 14
  FinalizeVideoLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${FinalizeVideoFn}'
      RetentionInDays: 14
  ClaimVideoLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${ClaimVideoFn}'
      RetentionInDays: 14
  SegmentUrlVideoLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${SegmentUrlVideoFn}'
      RetentionInDays: 14
  FinishedVideoLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${FinishedVideoFn}'
      RetentionInDays: 14
  ExtendVideoLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${ExtendVideoFn}'
      RetentionInDays: 14
  StatusVideoLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${StatusVideoFn}'
      RetentionInDays: 14
  DestroyVideoLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${DestroyVideoFn}'
      RetentionInDays: 14
  BurnVideoLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${BurnVideoFn}'
      RetentionInDays: 14

  # THESE FOUR ARE NOT DECLARED HERE YET, ON PURPOSE.
  #
  # /aws/lambda/blip-CreateNoteFn-*, ReadNoteFn, CreateFileFn, and
  # FinalizeFileFn ALREADY EXIST in CloudWatch. Lambda created them the first
  # time each function ran, and CloudFormation does not adopt a resource it did
  # not create — it tries to create it, gets ResourceAlreadyExistsException,
  # and rolls the whole stack update back. Verified 2026-07-27 against the live
  # account: all four exist, all four already carry 14-day retention, and
  # describe-stack-resources shows only ClaimFileLogGroup under management.
  #
  # ClaimFileLogGroup is the one that IS declared, and its lone DeletionPolicy:
  # Retain is the fingerprint of someone hitting this once and working around it
  # for a single group without writing it down.
  #
  # Bringing these four under management is a CloudFormation resource IMPORT,
  # which is a separate deliberate operation, not something to discover during a
  # release. Until that import runs, retention on these four is set but not
  # pinned in code, and docs/pro-payments.md says so rather than pretending.
  # The denial has to be visible. Reserved concurrency sheds silently, and with
  # no alarm the first signal Matt gets is a monthly statement. This watches the
  # shed count only — a number, never a request, never an address.
  ThrottleAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'cinder-delivery-throttled-${AWS::AccountId}'
      AlarmDescription: >-
        Cinder is shedding delivery requests. Recipients are seeing "Cinder is
        busy". Nothing has been destroyed — a throttled claim never runs — but
        the product is effectively down for the people being shed.
      Namespace: AWS/Lambda
      MetricName: Throttles
      Dimensions:
        - Name: FunctionName
          Value: !Ref ClaimFileFn
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 25
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref OperatorAlerts

  OperatorAlerts:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub 'cinder-operator-alerts-${AWS::AccountId}'
      DisplayName: Cinder alerts

  # --- Static site: private S3 bucket fronted by CloudFront (OAC) ---
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'blip-site-${AWS::AccountId}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  # Transport and framing headers at the edge. The Content-Security-Policy
  # itself is emitted by SvelteKit as a hashed <meta> (see vite.config.ts),
  # because the inline bootstrap script's hash changes every build and a static
  # header could only cover it with 'unsafe-inline'. `frame-ancestors` lives
  # here instead, since it is ignored inside a meta tag.
  SiteHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub 'cinder-security-headers-${AWS::AccountId}'
        SecurityHeadersConfig:
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 63072000
            IncludeSubdomains: true
            Preload: true
            Override: true
          ContentTypeOptions:
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: no-referrer
            Override: true
          FrameOptions:
            FrameOption: DENY
            Override: true
          ContentSecurityPolicy:
            ContentSecurityPolicy: "frame-ancestors 'none'; base-uri 'none'; form-action 'none'"
            Override: false
        CustomHeadersConfig:
          Items:
            # Cinder asks for no device capability anywhere. Say so, so a
            # compromised or injected script cannot quietly start asking.
            - Header: Permissions-Policy
              Value: 'camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()'
              Override: true

  SiteOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub 'blip-oac-${AWS::AccountId}'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  CinderViewerRequest:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub 'cinder-viewer-request-${AWS::AccountId}'
      AutoPublish: true
      FunctionConfig:
        Comment: Keep the apex canonical, give note links a crawler-readable shell, resolve extensionless routes
        Runtime: cloudfront-js-2.0
      FunctionCode: !Sub |
        function encodeQuery(query) {
          var pairs = [];

          for (var key in query) {
            var item = query[key];
            var values = item.multiValue || [item];

            for (var index = 0; index < values.length; index++) {
              pairs.push(encodeURIComponent(key) + '=' + encodeURIComponent(values[index].value));
            }
          }

          return pairs.length ? '?' + pairs.join('&') : '';
        }

        function handler(event) {
          var request = event.request;
          var host = request.headers.host.value.toLowerCase();

          if (host === '${WwwDomain}') {
            return {
              statusCode: 301,
              statusDescription: 'Moved Permanently',
              headers: {
                location: { value: 'https://${PrimaryDomain}' + request.uri + encodeQuery(request.querystring) }
              }
            };
          }

          if (request.uri.indexOf('/n/') === 0) request.uri = '/note.html';

          // Resolve an extensionless route to its prerendered .html key.
          //
          // WHY THIS EXISTS, because in six months only the code remains:
          // every prerendered page lands in build/ as `security.html`,
          // `pro/done.html`, and so on, while CloudFront asks for the
          // extensionless key. That used to be papered over by publishing a
          // SECOND, extensionless copy of every page to the bucket — keys that
          // existed only in S3 and never in build/. `aws s3 sync --delete` in
          // scripts/deploy-frontend.sh therefore deleted all of them on every
          // single deploy, and a loop republished them afterward. Inside that
          // window an origin miss became a 403, CustomErrorResponses below
          // turned it into an HTTP 200 serving the empty /200.html shell, and
          // the edge cached that for the 300s default. Any interrupted deploy
          // froze the site in that state. Rewriting here deletes the whole
          // class: no alias key exists, so --delete has nothing to remove.
          //
          // The guards, in the order they run:
          //   `/`                   DefaultRootObject owns the root. Explicit
          //                         rather than strictly necessary: the empty
          //                         last segment below would also skip it, and
          //                         if CloudFront substitutes the root object
          //                         before this function runs the URI is
          //                         /index.html and the dot rule skips it. All
          //                         three paths agree, and the root is the one
          //                         URL worth saying out loud.
          //   `/.well-known/…`      These are extensionless BY DESIGN. Apple's
          //                         apple-app-site-association carries no
          //                         extension, so a .html rewrite would send
          //                         universal links to the SPA shell. Keeps the
          //                         future TWA assetlinks note below honest too.
          //   a dot in the last segment
          //                         Real assets: /app.js, /favicon.ico,
          //                         /sitemap.xml, and the /note.html this
          //                         function just produced one line above.
          //                         The sibling `fobkit-clean-urls` function in
          //                         this same account tests the WHOLE uri for a
          //                         dot. Deliberately narrower here so a dotted
          //                         parent directory cannot strand a nested
          //                         extensionless route. Both are correct for
          //                         today's key layout; do not "align" them by
          //                         widening this one.
          //
          // ES5 only here and in fobkit-clean-urls: indexOf, charAt, slice —
          // never startsWith, endsWith, or includes. That is house style, not
          // a runtime limit: ash-allure-clean-urls runs endsWith on this same
          // cloudfront-js-2.0 runtime without complaint.
          //
          // A single trailing slash is dropped first so /field-notes/ reaches
          // the same key as /field-notes instead of falling to the shell.
          // A route with no prerendered page (/f/<locator>) misses either way
          // and still lands on the SPA shell, exactly as it did before.
          //
          // COUPLED TO THE BUILD, and this is the one that bites: `<path>.html`
          // is the correct key only while adapter-static emits FLAT files. Set
          // the `trailingSlash` page option to 'always' and it emits
          // `field-notes/index.html` instead — every prerendered page then
          // misses the origin, CustomErrorResponses turns each miss into an
          // HTTP 200 serving the empty 200.html shell, and the whole site goes
          // blank from a one-word config edit. src/lib/edge-viewer-request.test.ts
          // fails if that option is ever set to anything but 'never'. Read that
          // guard before changing either side; ash-allure-clean-urls is the
          // working reference for the directory-key shape.
          var uri = request.uri;

          if (uri !== '/' && uri.indexOf('/.well-known/') !== 0) {
            if (uri.charAt(uri.length - 1) === '/') uri = uri.slice(0, -1);

            var lastSegment = uri.slice(uri.lastIndexOf('/') + 1);

            if (lastSegment && lastSegment.indexOf('.') === -1) request.uri = uri + '.html';
          }

          return request;
        }

  SiteDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        PriceClass: PriceClass_100
        Aliases:
          - !Ref PrimaryDomain
          - !Ref WwwDomain
          - !Ref SiteDomain
          - !Ref LegacyDomain
        ViewerCertificate:
          AcmCertificateArn: !Ref CertificateArn
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        Origins:
          - Id: s3-site
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !Ref SiteOAC
            S3OriginConfig:
              OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: s3-site
          ViewerProtocolPolicy: redirect-to-https
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt CinderViewerRequest.FunctionMetadata.FunctionARN
          # CachingOptimized managed policy
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          ResponseHeadersPolicyId: !Ref SiteHeadersPolicy
        # SPA fallback: any unresolved path (e.g. /n/<id>) serves the app shell.
        # NOTE for the future Android/TWA phase: a /.well-known/assetlinks.json
        # behavior MUST be added ABOVE this fallback, or CloudFront will return
        # the SPA shell for it and silently break the TWA URL-bar removal.
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /200.html
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /200.html

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: 's3:GetObject'
            Resource: !Sub '${SiteBucket.Arn}/*'
            Condition:
              StringEquals:
                'AWS:SourceArn': !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${SiteDistribution}'

  # =====================================================================
  # mattOS IDENTITY — a portable identity layer whose first consumer is
  # Cinder Pro. Everything from here down is product-agnostic except the
  # single app client and the single pepper entry, which are the Cinder
  # instance of it.
  #
  # ONE POOL, ONE APP CLIENT PER PRODUCT. The pool is shared because the
  # expensive, human-gated parts — the Apple Services ID, the Apple signing
  # key, the Google OAuth client, and the one redirect URI all three of them
  # are pinned to — are configured once and then serve every domain. A pool
  # per product would mean repeating that console work per domain and asking
  # a person to sign in again on each one.
  #
  # A shared pool means one Cognito subject per person across every product,
  # which is exactly the correlation risk it sounds like. It is answered in
  # code, not by policy: no product ever stores the subject. Each stores
  # HMAC(its own pepper, "product:subject") — see api/src/identity.mjs. Two
  # products' entitlement rows for the same human cannot be joined without
  # both peppers. What is NOT solved: anyone holding the AWS account holds
  # both peppers and the pool. This design defends against a database leak
  # and against the products drifting into a shared profile. It does not
  # defend against the account owner, and no design in this account can.
  # =====================================================================

  MattosUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: mattos-identity
      # What is ABSENT here is the design. No Schema block, so not one custom
      # attribute exists. No AutoVerifiedAttributes and no EmailConfiguration,
      # so the pool never sends mail and has no address to send it to. No
      # LambdaConfig, so no trigger sees a sign-in. No UserPoolAddOns: threat
      # protection profiles people by device, IP, and behavior, which is the
      # single most invasive thing a Cognito pool can be asked to do.
      #
      # UserPoolTier must never be PLUS — PLUS is threat protection. LITE is
      # asserted here rather than assumed: confirm at first deploy that the
      # classic hosted UI is available on LITE in this region, and if it is
      # not, ESSENTIALS is the ceiling. Never PLUS.
      UserPoolTier: LITE
      # No native sign-up at all. Every account in this pool arrives through
      # Apple or Google; there is no password to store, reset, or leak, and
      # nobody can create a local account with an email address.
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      # There is no recovery path, because there is nothing to recover with:
      # no email, no phone. Naming admin_only says so explicitly instead of
      # letting Cognito default to verified_email and imply an address exists.
      AccountRecoverySetting:
        RecoveryMechanisms:
          - { Name: admin_only, Priority: 1 }
      DeletionProtection: ACTIVE

  MattosUserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Ref IdentityDomainPrefix
      UserPoolId: !Ref MattosUserPool

  # A pool may carry a prefix domain AND a custom domain at the same time —
  # AWS: "You can set up a user pool with both a custom domain and a prefix
  # domain that's owned by AWS." That is what makes the cutover safe: this
  # resource ADDS auth.cinder.ink without taking the prefix domain away, so
  # live sign-in keeps working while Apple and Google are re-pointed by hand.
  # Retire the prefix domain only after both consoles name the custom one.
  #
  # ManagedLoginVersion 1 on purpose: the pool is UserPoolTier LITE and the
  # prefix domain already serves the classic hosted UI. Version 2 (managed
  # login) would make the two domains render differently for the same pool.
  #
  # Cognito does NOT create the DNS record. After this resource exists, point
  # auth.cinder.ink at !GetAtt MattosUserPoolCustomDomain.CloudFrontDistribution
  # with an A ALIAS in the cinder.ink zone (Z073855230DF25J9RR4B7). DNS for
  # this stack lives outside it, as the four site aliases already do.
  MattosUserPoolCustomDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Ref IdentityCustomDomain
      UserPoolId: !Ref MattosUserPool
      ManagedLoginVersion: 1
      CustomDomainConfig:
        CertificateArn: !Ref IdentityCustomDomainCertArn

  # Sign in with Apple is the first-class path, and it is first-class in the
  # only way that means anything: `authorize_scopes` is empty, so Cinder asks
  # Apple for no name and no email — not even the private relay address. The
  # relay exists to hide a real address behind a forwarding one; asking for
  # neither is strictly better than asking for the relay. Apple returns a
  # stable subject and nothing else, which is the entire input this system
  # needs.
  AppleProvider:
    Type: AWS::Cognito::UserPoolIdentityProvider
    Properties:
      UserPoolId: !Ref MattosUserPool
      ProviderName: SignInWithApple
      ProviderType: SignInWithApple
      ProviderDetails:
        client_id: !Ref AppleServicesId
        team_id: !Ref AppleTeamId
        key_id: !Ref AppleKeyId
        private_key: !Ref ApplePrivateKey
        authorize_scopes: ''
      # The ONLY mapping. `username` is required by Cognito and is mapped to
      # the provider's opaque subject. Mapping `email` here is what would put
      # an address in the directory, so it is absent on purpose.
      AttributeMapping:
        username: sub

  # Google's minimum is `openid`, which returns a subject and nothing else.
  # `profile` and `email` are deliberately not requested.
  GoogleProvider:
    Type: AWS::Cognito::UserPoolIdentityProvider
    Properties:
      UserPoolId: !Ref MattosUserPool
      ProviderName: Google
      ProviderType: Google
      ProviderDetails:
        client_id: !Ref GoogleClientId
        client_secret: !Ref GoogleClientSecret
        authorize_scopes: openid
      AttributeMapping:
        username: sub

  # One app client per product. This is Cinder's. A second product adds a
  # second client with its own callback URLs and its own pepper, and changes
  # nothing else in this block.
  CinderAppClient:
    Type: AWS::Cognito::UserPoolClient
    # WITHOUT THIS, THE FIRST DEPLOY FAILS AND ROLLS THE WHOLE STACK BACK.
    #
    # SupportedIdentityProviders below names SignInWithApple and Google as
    # strings, and a string is not a reference, so CloudFormation sees no reason
    # to build the providers first. It creates the client, Cognito answers "The
    # provider SignInWithApple does not exist for User Pool …", and the update
    # rolls back. Measured on 2026-07-28, exactly that message.
    #
    # This is the "two-pass Cognito deploy" .notes/GOTCHAS.md warns about. An
    # explicit DependsOn is the fix, and it means one pass rather than two.
    DependsOn:
      - AppleProvider
      - GoogleProvider
    Properties:
      ClientName: cinder
      UserPoolId: !Ref MattosUserPool
      # A public browser client: no secret to embed, PKCE instead. Authorization
      # code only — the implicit flow would put tokens in a URL fragment, which
      # is the one place this product has already promised nothing sensitive
      # goes but a browser still logs.
      GenerateSecret: false
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      # `openid` alone. Not `email`, not `profile`, not `aws.cognito.signin.user.admin`
      # — that last one would let the browser's own access token read and write
      # user attributes, which is a capability nothing here needs.
      AllowedOAuthScopes: [openid]
      SupportedIdentityProviders: [SignInWithApple, Google]
      # An empty read/write set is a second, independent guarantee: even if an
      # attribute somehow got populated, this client could not read it.
      ReadAttributes: []
      WriteAttributes: []
      # No SRP, no password, no admin auth flow. The hosted UI's code exchange
      # is the only way to get a token from this client.
      ExplicitAuthFlows: [ALLOW_REFRESH_TOKEN_AUTH]
      EnableTokenRevocation: true
      PreventUserExistenceErrors: ENABLED
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days
      # 5 minutes is Cognito's floor and the right number here. An ID token is
      # stateless: signing out cannot recall one that was already issued, so
      # its lifetime IS the revocation delay. The entitlement check is a single
      # request at page load, so nothing needs a long-lived token.
      AccessTokenValidity: 5
      IdTokenValidity: 5
      # The refresh token is the thing sign-out actually revokes. Seven days
      # bounds a stolen one without asking someone to re-authenticate every day
      # to read a note they already paid for.
      RefreshTokenValidity: 7
      CallbackURLs:
        - !Sub 'https://${PrimaryDomain}/account'
        - !Sub 'https://${WwwDomain}/account'
        - !Sub 'https://${SiteDomain}/account'
        - http://127.0.0.1:5178/account
      LogoutURLs:
        - !Sub 'https://${PrimaryDomain}/account'
        - !Sub 'https://${WwwDomain}/account'
        - !Sub 'https://${SiteDomain}/account'
        - http://127.0.0.1:5178/account

  # One row per (product, person): a pairwise subject and a boolean. See the
  # header of api/src/entitlement-store.mjs for the complete item shape.
  # Separate from blip-notes so the note functions have no policy that can
  # reach it, and so a person's purchase and a person's note never share a
  # table to be joined in.
  EntitlementTable:
    Type: AWS::DynamoDB::Table
    # Retain, and this one is worse than the notes table if it goes. Every row
    # is something a person paid for, keyed by an HMAC of a subject, with no
    # email attached. Destroy it and there is no way to identify who lost what,
    # let alone restore it. GOTCHAS.md already records that; the policy is what
    # makes the record enforceable.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: mattos-entitlements
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
      # TTL is enabled, and it does NOT expire entitlements. DynamoDB only reaps
      # items that CARRY the attribute, and an entitlement row has no expiresAt
      # — a purchase does not expire on its own, and the only thing that removes
      # one is the person asking. What TTL is here for is the other row kind in
      # this table: the pending-purchase translation written by the checkout
      # route (api/src/purchase-store.mjs). That row is the one artifact that can
      # map Stripe's stored reference back to a person, the webhook deletes it
      # the moment a grant lands, and this is what erases the abandoned ones —
      # an abandoned checkout must not leave a permanent record of an intent to
      # buy.
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  # A SEPARATE HTTP API from the note and file endpoints, and the separation is
  # the point. This is the only API in the account whose CORS admits an
  # Authorization header, so a browser cannot attach a token to a note request
  # even by mistake. Different API, different access log, different stage.
  IdentityApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins:
          - !Sub 'https://${PrimaryDomain}'
          - !Sub 'https://${WwwDomain}'
          - !Sub 'https://${SiteDomain}'
        AllowMethods: [POST, OPTIONS]
        AllowHeaders: [content-type, authorization]
      DefaultRouteSettings:
        ThrottlingBurstLimit: 20
        ThrottlingRateLimit: 10

  CheckEntitlementFn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: api/
      Handler: src/identity-lambda.checkEntitlement
      Environment:
        Variables:
          USER_POOL_ID: !Ref MattosUserPool
          ENTITLEMENT_TABLE: !Ref EntitlementTable
          CLIENT_PRODUCTS: !Sub '{"${CinderAppClient}": "cinder"}'
          PRODUCT_PEPPERS: !Sub '{"cinder": "${CinderPepper}"}'
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem]
              Resource: !GetAtt EntitlementTable.Arn
      Events:
        Check:
          Type: HttpApi
          Properties:
            ApiId: !Ref IdentityApi
            Path: /entitlement
            Method: POST

  # The mint. Spends one credit and signs a grant.
  #
  # It needs UpdateItem, and that is a real widening worth stating plainly:
  # before credits this role could only read, so the webhook was the only role in
  # the account that could write the entitlement table at all. DynamoDB cannot
  # constrain an IAM principal to a particular UpdateExpression, so the narrowing
  # that remains is in the code — spendCredit only ever subtracts, under a
  # condition that refuses to go below zero, and this handler never calls
  # addCredits. What has NOT widened is the privacy boundary: this role still
  # cannot read a note, cannot see a transfer, and writes nothing but a number on
  # a row that is already its caller's.
  MintCapabilityFn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: api/
      Handler: src/identity-lambda.mintCapability
      Environment:
        Variables:
          USER_POOL_ID: !Ref MattosUserPool
          ENTITLEMENT_TABLE: !Ref EntitlementTable
          CLIENT_PRODUCTS: !Sub '{"${CinderAppClient}": "cinder"}'
          PRODUCT_PEPPERS: !Sub '{"cinder": "${CinderPepper}"}'
          CAPABILITY_SECRET: !Ref CinderCapabilitySecret
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:UpdateItem]
              Resource: !GetAtt EntitlementTable.Arn
      Events:
        Mint:
          Type: HttpApi
          Properties:
            ApiId: !Ref IdentityApi
            Path: /capability
            Method: POST

  DeleteAccountFn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: api/
      Handler: src/identity-lambda.deleteAccount
      Environment:
        Variables:
          USER_POOL_ID: !Ref MattosUserPool
          ENTITLEMENT_TABLE: !Ref EntitlementTable
          CLIENT_PRODUCTS: !Sub '{"${CinderAppClient}": "cinder"}'
          # EVERY product's pepper, not just the caller's. A row is keyed by an
          # HMAC of the Cognito subject, so once the pool record is deleted its
          # key can never be computed again. A product missing from this map
          # leaves a row that is unreachable rather than erased.
          PRODUCT_PEPPERS: !Sub '{"cinder": "${CinderPepper}"}'
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:DeleteItem]
              Resource: !GetAtt EntitlementTable.Arn
            # AdminDeleteUser and nothing else. This role cannot list users,
            # read a user, or read an attribute — it can only erase the caller
            # it has already proven is the caller.
            - Effect: Allow
              Action: [cognito-idp:AdminDeleteUser]
              Resource: !GetAtt MattosUserPool.Arn
      Events:
        Delete:
          Type: HttpApi
          Properties:
            ApiId: !Ref IdentityApi
            Path: /account/delete
            Method: POST

  # --- purchase ------------------------------------------------------------
  #
  # Two functions, on the identity API because a checkout needs a verified token
  # and the note API refuses the Authorization header at CORS.
  #
  # Both hold Stripe secrets, so both are deliberately narrow: checkout can write
  # a pending row and read an entitlement, and cannot grant one. The webhook is
  # the ONLY role in the account with dynamodb:PutItem on the entitlement table.
  # There is exactly one way to become entitled and this is it.

  StartCheckoutFn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: api/
      Handler: src/identity-lambda.startCheckout
      # A Stripe API call over the network, from a cold container.
      Timeout: 10
      Environment:
        Variables:
          USER_POOL_ID: !Ref MattosUserPool
          ENTITLEMENT_TABLE: !Ref EntitlementTable
          CLIENT_PRODUCTS: !Sub '{"${CinderAppClient}": "cinder"}'
          PRODUCT_PEPPERS: !Sub '{"cinder": "${CinderPepper}"}'
          STRIPE_SECRET_KEYS: !Sub '{"cinder": "${CinderStripeSecretKey}"}'
          PRODUCT_PRICES: !Sub '{"cinder": "${CinderProPriceId}"}'
          PRODUCT_RETURN_URLS: !Sub '{"cinder": {"success": "https://${PrimaryDomain}/pro/done", "cancel": "https://${PrimaryDomain}/pro"}}'
      Policies:
        - Statement:
            # PutItem is scoped to the table, not to a key prefix — DynamoDB has
            # no such condition for a simple primary key. What actually stops
            # this function from adding credits is that it never calls
            # addCredits; see the audit note in entitlement-store.mjs. It writes
            # pending rows and nothing else, and under credits it no longer reads
            # the entitlement row at all: a top-up is never refused.
            - Effect: Allow
              Action: [dynamodb:PutItem]
              Resource: !GetAtt EntitlementTable.Arn
      Events:
        Start:
          Type: HttpApi
          Properties:
            ApiId: !Ref IdentityApi
            Path: /purchase/checkout
            Method: POST

  # Stripe calls this, so it is the one route here that is NOT token-gated and
  # cannot be. Its authorization is the webhook signature, and everything it is
  # willing to do is bounded by a pending row this account minted itself.
  PurchaseWebhookFn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: api/
      Handler: src/identity-lambda.purchaseWebhook
      Environment:
        Variables:
          ENTITLEMENT_TABLE: !Ref EntitlementTable
          STRIPE_WEBHOOK_SECRETS: !Sub '{"cinder": "${CinderStripeWebhookSecret}"}'
          # How many sends one settled payment adds. Read ONLY here, because this
          # is the only function that credits anything.
          PRODUCT_CREDITS: !Sub '{"cinder": ${CinderProCredits}}'
          # Present because the handler module is shared with the identity
          # routes and reads them at import. The webhook itself verifies no
          # token and derives no subject: it reads the pairwise value out of the
          # pending row and never computes one.
          USER_POOL_ID: !Ref MattosUserPool
          CLIENT_PRODUCTS: !Sub '{"${CinderAppClient}": "cinder"}'
          PRODUCT_PEPPERS: !Sub '{"cinder": "${CinderPepper}"}'
      Policies:
        - Statement:
            # UpdateItem adds credits; DeleteItem is the exclusive claim on the
            # pending row that keeps a duplicate delivery from adding them twice;
            # PutItem puts that row BACK if the credit write then fails.
            - Effect: Allow
              Action:
                [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:DeleteItem]
              Resource: !GetAtt EntitlementTable.Arn
      Events:
        Hook:
          Type: HttpApi
          Properties:
            ApiId: !Ref IdentityApi
            Path: /purchase/webhook
            Method: POST

  # Explicit log groups with a short retention. Neither function logs a subject
  # or a token — but Lambda writes a START/END/REPORT line per invocation
  # regardless, and those lines carry a timestamp. Three days is long enough to
  # debug a deploy and short enough that the timing record of who checked an
  # entitlement when does not accumulate.
  CheckEntitlementLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${CheckEntitlementFn}'
      RetentionInDays: 3

  # The one invoked at the moment of every paid send, and the one that was
  # missed. Without this group its retention is Lambda's default, which is
  # forever — while field note 001 publishes "log retention pinned in
  # infrastructure code rather than left at the default of forever." Three days,
  # matching its siblings: a timing record of who spent a credit when is exactly
  # the accumulation this whole design refuses.
  MintCapabilityLogs:
    Type: AWS::Logs::LogGroup
    # Deliberately NOT Retain, unlike the four note/file groups. Those four
    # already exist in CloudWatch and have to be imported, which requires
    # Retain. This function has never deployed, so Retain here would mean a
    # failed first deploy leaves an orphan group behind that then collides on
    # the retry — recreating the exact trap the other four are in.
    Properties:
      LogGroupName: !Sub '/aws/lambda/${MintCapabilityFn}'
      RetentionInDays: 3

  DeleteAccountLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${DeleteAccountFn}'
      RetentionInDays: 3

  StartCheckoutLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${StartCheckoutFn}'
      RetentionInDays: 3

  # Fourteen days rather than three, and it is the one deliberate exception.
  # A payment that did not become an entitlement is a support case with a person
  # on the other end of it, and three days is shorter than someone takes to
  # notice and write in. The lines are Lambda's own START/END/REPORT: no body, no
  # signature, no reference, no subject — the handler logs nothing itself.
  PurchaseWebhookLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${PurchaseWebhookFn}'
      RetentionInDays: 14

Outputs:
  ApiUrl:
    Description: Base URL of the blip API
    Value: !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com'
  SiteBucketName:
    Description: S3 bucket for the static site
    Value: !Ref SiteBucket
  DistributionId:
    Description: CloudFront distribution id (for invalidations)
    Value: !Ref SiteDistribution
  SiteUrl:
    Description: Public site URL
    Value: !Sub 'https://${SiteDistribution.DomainName}'
  IdentityApiUrl:
    Description: Base URL of the mattOS identity API (VITE_IDENTITY_API_BASE)
    Value: !Sub 'https://${IdentityApi}.execute-api.${AWS::Region}.amazonaws.com'
  IdentityHostedUi:
    Description: Cognito hosted-UI origin (VITE_IDENTITY_HOSTED_UI)
    Value: !Sub 'https://${IdentityCustomDomain}'
  IdentityHostedUiPrefix:
    Description: Legacy prefix hosted-UI origin, still serving during the cutover
    Value: !Sub 'https://${IdentityDomainPrefix}.auth.${AWS::Region}.amazoncognito.com'
  IdentityCustomDomainAliasTarget:
    Description: CloudFront target for the auth.cinder.ink A ALIAS record
    Value: !GetAtt MattosUserPoolCustomDomain.CloudFrontDistribution
  CinderClientId:
    Description: App client ID for Cinder (VITE_IDENTITY_CLIENT_ID)
    Value: !Ref CinderAppClient
