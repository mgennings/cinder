<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />

		<!-- Sized so a 16px tab strip downscales the 32 instead of the 64: the mark
	     was measured at both and the 32 keeps a readable void around the ember. -->
		<link rel="icon" type="image/png" sizes="32x32" href="%sveltekit.assets%/favicon-32.png" />
		<link rel="icon" type="image/png" sizes="64x64" href="%sveltekit.assets%/favicon.png" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<meta name="theme-color" content="#0d0b0a" />

		<!-- Default social card. Per-page titles/descriptions override via <svelte:head>. -->
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="Cinder" />
		<meta property="og:title" content="Cinder — an encrypted note or file retrieved once" />
		<meta
			property="og:description"
			content="Encrypted in your browser, the key never touches the server. One successful reveal removes Cinder's stored copy."
		/>
		<meta property="og:image" content="https://cinder.ink/og.png" />
		<meta property="og:url" content="https://cinder.ink" />
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="Cinder — an encrypted note or file retrieved once" />
		<meta
			name="twitter:description"
			content="One successful reveal removes Cinder's stored copy. Copies outside Cinder remain outside its control."
		/>
		<meta name="twitter:image" content="https://cinder.ink/og.png" />

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
